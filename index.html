<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Tracker & Search</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #bb86fc;
            --danger: #cf6679;
            --input-bg: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .info-box {
            background-color: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        button.btn-reset {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button.btn-reset:hover {
            opacity: 0.8;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* Styling Bagian Pencarian */
        .search-section {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .search-section h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .search-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--input-bg);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        button.btn-search {
            background-color: var(--accent);
            color: #121212;
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 5px;
        }

        button.btn-search:hover {
            opacity: 0.8;
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: var(--accent);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">Menghubungkan ke Firebase...</div>

    <!-- Timer Section -->
    <div class="container">
        <h1>Progressive Tracker</h1>
        <p class="subtitle">Waktu tunggu akan berlipat ganda setiap kali tombol ditekan.</p>
        
        <div class="timer-display" id="countdown">00:00:00:00</div>
        
        <div class="info-box">
            <div>Target Interval Saat Ini: <strong id="current-interval">1 Hari</strong></div>
            <div style="margin-top: 5px; color: var(--text-muted); font-size: 0.8rem;">
                Target Selesai: <span id="target-date">-</span>
            </div>
        </div>

        <button class="btn-reset" id="btn-action">SAYA SUDAH MELAKUKANNYA</button>
    </div>

    <!-- Search Section -->
    <div class="search-section">
        <h2>Pencarian Media</h2>
        <div class="search-controls">
            
            <div class="input-group">
                <label for="search-input">Kata Kunci Pencarian</label>
                <input type="text" id="search-input" placeholder="Ketik apa yang ingin Anda cari..." onkeypress="handleKeyPress(event)">
            </div>

            <div class="input-group">
                <label for="search-platform">Pilih Platform</label>
                <select id="search-platform">
                    <option value="google">Google Images (Gambar)</option>
                    <option value="tiktok">TikTok (Video)</option>
                </select>
            </div>

            <button class="btn-search" onclick="executeSearch()">Cari di Tab Baru</button>

        </div>
    </div>

    <!-- Script Pencarian -->
    <script>
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        }

        function executeSearch() {
            const query = document.getElementById("search-input").value.trim();
            const platform = document.getElementById("search-platform").value;
            
            if (!query) {
                alert("Silakan masukkan kata kunci pencarian terlebih dahulu.");
                return;
            }

            let searchUrl = "";
            
            if (platform === "google") {
                // Format URL pencarian Google khusus Gambar
                searchUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(query)}`;
            } else if (platform === "tiktok") {
                // Format URL pencarian TikTok
                searchUrl = `https://www.tiktok.com/search?q=${encodeURIComponent(query)}`;
            }

            // Membuka URL di tab baru
            if (searchUrl) {
                window.open(searchUrl, "_blank");
            }
        }
    </script>

    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Konfigurasi Firebase Anda (smart-relay-esp32-e285e)
        const firebaseConfig = {
            apiKey: "AIzaSyDVVNrVrW46U8qQdgXSbjqUh6MZgWGd2zc",
            authDomain: "smart-relay-esp32-e285e.firebaseapp.com",
            databaseURL: "https://smart-relay-esp32-e285e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "smart-relay-esp32-e285e",
            storageBucket: "smart-relay-esp32-e285e.firebasestorage.app",
            messagingSenderId: "439506799534",
            appId: "1:439506799534:web:65b2d29db56737f43f963f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const docRef = doc(db, "trackerData", "myTracker");

        let targetTimestamp = 0;
        let currentIntervalDays = 1;
        let timerInterval;

        const countdownEl = document.getElementById("countdown");
        const intervalEl = document.getElementById("current-interval");
        const targetDateEl = document.getElementById("target-date");
        const btnAction = document.getElementById("btn-action");
        const loadingOverlay = document.getElementById("loading-overlay");

        async function loadData() {
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    targetTimestamp = data.targetTimestamp || 0;
                    currentIntervalDays = data.intervalDays || 1;
                } else {
                    targetTimestamp = 0;
                    currentIntervalDays = 1; 
                }
                updateUI();
                startTimer();
                loadingOverlay.style.display = "none";
            } catch (error) {
                console.error("Error loading Firebase data:", error);
                alert("Gagal memuat data dari Firebase. Pastikan koneksi dan aturan database Anda benar.");
                loadingOverlay.style.display = "none";
            }
        }

        async function saveData(newTimestamp, newInterval) {
            btnAction.disabled = true;
            btnAction.innerText = "Menyimpan...";
            try {
                await setDoc(docRef, {
                    targetTimestamp: newTimestamp,
                    intervalDays: newInterval,
                    lastUpdated: Date.now()
                });
                targetTimestamp = newTimestamp;
                currentIntervalDays = newInterval;
                updateUI();
            } catch (error) {
                console.error("Error saving to Firebase:", error);
                alert("Gagal menyimpan data ke Firebase!");
            }
            btnAction.disabled = false;
            btnAction.innerText = "SAYA SUDAH MELAKUKANNYA";
        }

        btnAction.addEventListener("click", () => {
            const confirmAction = confirm("Apakah Anda yakin? Target waktu tunggu selanjutnya akan dikali 2.");
            if (confirmAction) {
                let nextInterval = currentIntervalDays;
                
                if (targetTimestamp > 0) {
                    nextInterval = currentIntervalDays * 2;
                }

                const now = Date.now();
                const msInDay = 24 * 60 * 60 * 1000;
                const newTargetTimestamp = now + (nextInterval * msInDay);

                saveData(newTargetTimestamp, nextInterval);
            }
        });

        function updateUI() {
            intervalEl.innerText = `${currentIntervalDays} Hari`;
            if (targetTimestamp > 0) {
                const dateObj = new Date(targetTimestamp);
                targetDateEl.innerText = dateObj.toLocaleString('id-ID');
            } else {
                targetDateEl.innerText = "-";
                countdownEl.innerText = "Mulai Tracker";
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (targetTimestamp === 0) return;

                const now = Date.now();
                const distance = targetTimestamp - now;

                if (distance < 0) {
                    countdownEl.innerText = "WAKTU TUNGGU SELESAI!";
                    countdownEl.style.color = "var(--danger)";
                    return;
                }

                countdownEl.style.color = "var(--accent)";
                
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                countdownEl.innerText = 
                    `${String(days).padStart(2, '0')}h : ` +
                    `${String(hours).padStart(2, '0')}j : ` +
                    `${String(minutes).padStart(2, '0')}m : ` +
                    `${String(seconds).padStart(2, '0')}d`;
            }, 1000);
        }

        loadData();
    </script>
</body>
</html>
