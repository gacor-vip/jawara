<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Tracker & Media Feed</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #bb86fc;
            --danger: #cf6679;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .info-box {
            background-color: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        button.btn-reset {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button.btn-reset:hover {
            opacity: 0.8;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .media-section {
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .media-section h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Desain Wadah Scroll (Feed) */
        .scroll-feed {
            max-height: 70vh; /* Tinggi wadah menyesuaikan layar */
            overflow-y: auto; /* Memungkinkan scroll vertikal */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Jarak antar video */
            padding-right: 10px;
        }

        /* Modifikasi Scrollbar agar terlihat lebih elegan */
        .scroll-feed::-webkit-scrollbar {
            width: 8px;
        }
        .scroll-feed::-webkit-scrollbar-track {
            background: #121212;
            border-radius: 8px;
        }
        .scroll-feed::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 8px;
        }
        .scroll-feed::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .embed-item {
            width: 100%;
            max-width: 350px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            min-height: 580px; /* Tinggi standar video vertikal */
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            min-height: 580px;
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: var(--accent);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">Menghubungkan ke Firebase...</div>

    <!-- Timer Section -->
    <div class="container">
        <h1>Progressive Tracker</h1>
        <p class="subtitle">Waktu tunggu akan berlipat ganda setiap kali tombol ditekan.</p>
        
        <div class="timer-display" id="countdown">00:00:00:00</div>
        
        <div class="info-box">
            <div>Target Interval Saat Ini: <strong id="current-interval">1 Hari</strong></div>
            <div style="margin-top: 5px; color: var(--text-muted); font-size: 0.8rem;">
                Target Selesai: <span id="target-date">-</span>
            </div>
        </div>

        <button class="btn-reset" id="btn-action">SAYA SUDAH MELAKUKANNYA</button>
    </div>

    <!-- Media Section (Feed) -->
    <div class="media-section">
        <h2>Feed Konten (Scroll ke Bawah)</h2>
        
        <!-- Wadah Scroll -->
        <div class="scroll-feed">
            
            <!-- Video 1 (TikTok) -->
            <div class="embed-item">
                <iframe src="https://vt.tiktok.com/ZSbjUpxn9/" allowfullscreen scrolling="no" allow="encrypted-media;"></iframe>
            </div>

            <!-- Video 2 (TikTok) - Ganti angka ID di bagian belakang link untuk video lain -->
            <div class="embed-item">
                <iframe src="https://vt.tiktok.com/ZSbjy1VaR/" allowfullscreen scrolling="no" allow="encrypted-media;"></iframe>
            </div>

            <!-- Video 3 (Instagram) -->
            <div class="embed-item">
                <!-- Ganti link dengan link Instagram /embed yang Anda inginkan -->
                <iframe src="https://www.instagram.com/p/C0A_abcD123/embed" allowfullscreen scrolling="no" allow="encrypted-media;"></iframe>
            </div>

            <!-- Anda bisa menyalin <div class="embed-item"> di atas dan menempelkannya di sini sebanyak yang Anda mau untuk menambah daftar scroll -->

        </div>
    </div>

    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDVVNrVrW46U8qQdgXSbjqUh6MZgWGd2zc",
            authDomain: "smart-relay-esp32-e285e.firebaseapp.com",
            databaseURL: "https://smart-relay-esp32-e285e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "smart-relay-esp32-e285e",
            storageBucket: "smart-relay-esp32-e285e.firebasestorage.app",
            messagingSenderId: "439506799534",
            appId: "1:439506799534:web:65b2d29db56737f43f963f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const docRef = doc(db, "trackerData", "myTracker");

        let targetTimestamp = 0;
        let currentIntervalDays = 1;
        let timerInterval;

        const countdownEl = document.getElementById("countdown");
        const intervalEl = document.getElementById("current-interval");
        const targetDateEl = document.getElementById("target-date");
        const btnAction = document.getElementById("btn-action");
        const loadingOverlay = document.getElementById("loading-overlay");

        async function loadData() {
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    targetTimestamp = data.targetTimestamp || 0;
                    currentIntervalDays = data.intervalDays || 1;
                } else {
                    targetTimestamp = 0;
                    currentIntervalDays = 1; 
                }
                updateUI();
                startTimer();
                loadingOverlay.style.display = "none";
            } catch (error) {
                console.error("Error loading Firebase data:", error);
                alert("Gagal memuat data. Pastikan Firestore Database diaktifkan pada project smart-relay-esp32-e285e Anda.");
                loadingOverlay.style.display = "none";
            }
        }

        async function saveData(newTimestamp, newInterval) {
            btnAction.disabled = true;
            btnAction.innerText = "Menyimpan...";
            try {
                await setDoc(docRef, {
                    targetTimestamp: newTimestamp,
                    intervalDays: newInterval,
                    lastUpdated: Date.now()
                });
                targetTimestamp = newTimestamp;
                currentIntervalDays = newInterval;
                updateUI();
            } catch (error) {
                console.error("Error saving to Firebase:", error);
                alert("Gagal menyimpan data ke Firebase!");
            }
            btnAction.disabled = false;
            btnAction.innerText = "SAYA SUDAH MELAKUKANNYA";
        }

        btnAction.addEventListener("click", () => {
            const confirmAction = confirm("Apakah Anda yakin? Target waktu tunggu selanjutnya akan dikali 2.");
            if (confirmAction) {
                let nextInterval = currentIntervalDays;
                
                if (targetTimestamp > 0) {
                    nextInterval = currentIntervalDays * 2;
                }

                const now = Date.now();
                const msInDay = 24 * 60 * 60 * 1000;
                const newTargetTimestamp = now + (nextInterval * msInDay);

                saveData(newTargetTimestamp, nextInterval);
            }
        });

        function updateUI() {
            intervalEl.innerText = `${currentIntervalDays} Hari`;
            if (targetTimestamp > 0) {
                const dateObj = new Date(targetTimestamp);
                targetDateEl.innerText = dateObj.toLocaleString('id-ID');
            } else {
                targetDateEl.innerText = "-";
                countdownEl.innerText = "Mulai Tracker";
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (targetTimestamp === 0) return;

                const now = Date.now();
                const distance = targetTimestamp - now;

                if (distance < 0) {
                    countdownEl.innerText = "WAKTU TUNGGU SELESAI!";
                    countdownEl.style.color = "var(--danger)";
                    return;
                }

                countdownEl.style.color = "var(--accent)";
                
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                countdownEl.innerText = 
                    `${String(days).padStart(2, '0')}h : ` +
                    `${String(hours).padStart(2, '0')}j : ` +
                    `${String(minutes).padStart(2, '0')}m : ` +
                    `${String(seconds).padStart(2, '0')}d`;
            }, 1000);
        }

        loadData();
    </script>
</body>
</html>
